<dialog class="lightbox" data-lightbox-dialog aria-label="Image viewer">
  <figure class="lightbox__figure">
    <div class="lightbox__stage">
      <img class="lightbox__img" alt="" data-lightbox-img>
    </div>
    <figcaption class="lightbox__caption">
      <span data-lightbox-caption></span>
      <span class="lightbox__counter" data-lightbox-counter></span>
    </figcaption>
  </figure>
  <button type="button" class="lightbox__btn lightbox__close" data-lightbox-close aria-label="Close">&times;</button>
  <button type="button" class="lightbox__btn lightbox__prev" data-lightbox-step="-1" aria-label="Previous image">&lsaquo;</button>
  <button type="button" class="lightbox__btn lightbox__next" data-lightbox-step="1" aria-label="Next image">&rsaquo;</button>
</dialog>
